<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Honeymoon">
<!-- Single meta, no media query. The theme can be overridden manually, so the
     media-scoped pair would tint the status bar wrong whenever the chosen
     theme disagreed with the system. app.js keeps this in sync. -->
<meta name="theme-color" id="theme-color" content="#f7f1e6">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Honeymoon</title>
<script id="theme-init">try{var t=localStorage.getItem('hm.theme.v1');if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style id="app-style">/* ------------------------------------------------------------------
   Palette: cream and espresso — the wedding colours.
   Espresso is dark enough to be both the accent and legible, so unlike
   the previous sage it does not fight readability in daylight. Terracotta
   is kept for the few places that need to say "check this", and a muted
   olive for "settled" — a two-colour palette leaves nowhere to put
   meaning otherwise.
   ------------------------------------------------------------------ */

:root {
  --cream: #f7f1e6;
  --paper: #fffcf6;
  --accent: #6b4f39;
  --accent-soft: #a08a70;
  --accent-deep: #4a3426;
  --warm: #c9ab84;
  --warm-soft: #eee1cd;
  --ink: #33251c;
  --muted: #8a7259;
  --rule: #e6d9c6;
  --alert: #9c5b45;
  --alert-bg: #f7e8e0;
  --ok: #5c6338;
  --ok-bg: #efedd8;

  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;

  --nav-h: calc(58px + env(safe-area-inset-bottom, 0px));
  --page-max: 640px;
}

/* Dark values live in one place and are applied by two selectors: the system
   preference (unless light has been chosen explicitly) and the explicit dark
   choice. CSS has no way to share a block between them, so it is duplicated -
   change both together. */

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cream: #1e1712;
    --paper: #271e17;
    --accent: #c9ab84;
    --accent-soft: #8a7259;
    --accent-deep: #e0cdb4;
    --warm: #b3906a;
    --warm-soft: #35281e;
    --ink: #f0e7da;
    --muted: #a3907a;
    --rule: #3d2f24;
    --alert: #d98e74;
    --alert-bg: #3a2620;
    --ok: #a9b58c;
    --ok-bg: #2a2c1f;
  }
}

:root[data-theme="dark"] {
  --cream: #1e1712;
  --paper: #271e17;
  --accent: #c9ab84;
  --accent-soft: #8a7259;
  --accent-deep: #e0cdb4;
  --warm: #b3906a;
  --warm-soft: #35281e;
  --ink: #f0e7da;
  --muted: #a3907a;
  --rule: #3d2f24;
  --alert: #d98e74;
  --alert-bg: #3a2620;
  --ok: #a9b58c;
  --ok-bg: #2a2c1f;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; }

a { color: var(--accent-deep); }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 0 20px calc(var(--nav-h) + 32px);
}

.hidden { display: none !important; }

/* ---------------- lock screen ---------------- */

#lock {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 28px calc(40px + env(safe-area-inset-bottom, 0px));
  background: var(--cream);
}

.lock-rule {
  width: 44px;
  height: 1px;
  background: var(--accent);
  margin: 26px auto;
}

.lock-script {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 21px;
  color: var(--accent);
}

.lock-names {
  font-family: var(--font-display);
  font-size: clamp(30px, 9vw, 40px);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-deep);
  line-height: 1.25;
}

.lock-meta {
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 10px;
}

.countdown {
  display: flex;
  gap: 22px;
  justify-content: center;
  margin: 34px 0 6px;
}

.countdown div { min-width: 52px; }

.countdown .n {
  font-family: var(--font-display);
  font-size: 32px;
  color: var(--accent-deep);
  font-variant-numeric: tabular-nums;
}

.countdown .l {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.lock-hint {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 18px;
  color: var(--muted);
  margin: 22px 0 30px;
  max-width: 22em;
}

#lock form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); }

#pass {
  font-family: var(--font-body);
  font-size: 16px;
  text-align: center;
  padding: 13px 16px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  width: 100%;
}

#pass:focus { outline: none; border-color: var(--accent); }

.btn {
  background: var(--accent-deep);
  color: var(--cream);
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 15px;
  letter-spacing: 0.04em;
  text-align: center;
}

.btn.ghost {
  background: none;
  border: 1px solid var(--rule);
  color: var(--accent-deep);
}

.lock-error { color: var(--alert); font-size: 14px; min-height: 20px; }

/* ---------------- header ---------------- */

.hdr { padding: 28px 0 18px; }

.hdr .eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.hdr h1 { font-size: 30px; color: var(--accent-deep); margin-top: 6px; line-height: 1.2; }

.hdr .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }

.wx {
  margin-top: 8px;
  font-size: 14px;
  color: var(--accent);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.wx-age {
  display: block;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}

.wx.stale { color: var(--muted); }

/* ---------------- banners ---------------- */

.banner {
  background: var(--warm-soft);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 14.5px;
  margin-bottom: 20px;
  color: var(--accent-deep);
}

.banner.warn { background: var(--alert-bg); color: var(--alert); }

/* ---------------- day nav ---------------- */

.daystrip {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 4px 20px 14px;
  margin: 0 -20px;
  scrollbar-width: none;
}

.daystrip::-webkit-scrollbar { display: none; }

.daystrip button {
  flex: 0 0 auto;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  font-size: 13px;
  color: var(--muted);
  background: var(--paper);
  white-space: nowrap;
}

.daystrip button[aria-current="true"] {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  color: var(--cream);
}

/* ---------------- events ---------------- */

.events { margin-top: 6px; }

.ev {
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 14px;
  padding: 18px 0;
  border-top: 1px solid var(--rule);
}

.ev:first-child { border-top: none; }

.ev-time {
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  padding-top: 1px;
}

.ev-time .ampm { font-size: 12px; color: var(--muted); }

.ev-time.derived { color: var(--accent); border-bottom: 1px dashed var(--accent-soft); display: inline-block; }

.ev-time.step {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--muted);
  font-size: 15px;
}

.ev-title { font-family: var(--font-display); font-size: 19px; line-height: 1.3; color: var(--ink); }

.ev-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }

.ev-notes { font-size: 14.5px; color: var(--accent-deep); margin-top: 8px; line-height: 1.45; }

.ev.optional .ev-title { color: var(--muted); font-style: italic; }

.ev-sub.leaveby { color: var(--accent); }

.nowtag {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}

.ev.is-now { border-left: 2px solid var(--accent); padding-left: 12px; margin-left: -14px; }
.ev.is-now .nowtag { color: var(--accent-deep); }
.ev.is-next { opacity: 1; }
.ev.is-next .nowtag { color: var(--muted); }

/* ---------------- reveal ---------------- */

#reveal {
  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 30px calc(40px + env(safe-area-inset-bottom, 0px));
  background: var(--cream);
}

#reveal .lock-names { margin-bottom: 8px; }

.reveal-line {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.6;
  color: var(--accent-deep);
  max-width: 24em;
  margin: 16px 0;
}

/* The closing line is the flourish, not another paragraph. */
.reveal-line:last-of-type {
  font-style: italic;
  color: var(--accent);
  font-size: 19px;
  margin-top: 26px;
}

#reveal-go { margin-top: 26px; min-width: 240px; }
#reveal-go[disabled] { opacity: 0.55; }
/* Deliberately small and out of the way. The surprise is the main path;
   this is the escape hatch, not an equal choice. */
#reveal-later {
  position: absolute;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  min-width: 0;
  padding: 9px 14px;
  font-size: 13px;
  border: none;
  color: var(--muted);
  background: none;
  letter-spacing: 0.04em;
}

/* ---------------- montage ---------------- */

#montage {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 0 calc(20px + env(safe-area-inset-bottom, 0px));
}

#montage-video {
  width: 100%;
  max-height: calc(100dvh - 90px);
  background: #000;
  display: block;
}

#montage-skip {
  margin-top: 16px;
  min-width: 160px;
  color: var(--cream);
  border-color: rgba(255, 255, 255, 0.35);
}

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }

.tag {
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--warm-soft);
  color: var(--accent-deep);
}

.tag.plan { background: none; border: 1px solid var(--rule); color: var(--muted); }

/* ---------------- gap / suggestions ---------------- */

.gap {
  border: 1px dashed var(--warm);
  border-radius: 12px;
  margin: 4px 0 18px;
  background: color-mix(in srgb, var(--warm-soft) 45%, transparent);
}

.gap summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  list-style: none;
  -webkit-tap-highlight-color: transparent;
}

.gap summary::-webkit-details-marker { display: none; }

.gap-len {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 17px;
  color: var(--accent-deep);
}

.gap-count {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}

.gap-count:after { content: " ▾"; }
.gap[open] .gap-count:after { content: " ▴"; }

.gap-body { padding: 0 16px 6px; }

.gap-intro {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 4px;
}

.sugg { padding: 14px 0; border-top: 1px solid var(--rule); }

.sugg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

.sugg-head input {
  width: 20px;
  height: 20px;
  accent-color: var(--accent);
  flex: 0 0 auto;
  align-self: flex-start;
  margin: 2px 0 0;
}

.sugg-title { font-family: var(--font-display); font-size: 17px; color: var(--ink); flex: 1; }

.sugg.ticked .sugg-title { text-decoration: line-through; color: var(--muted); }

.sugg.ticked .sugg-note,
.sugg.ticked .sugg-meta { opacity: 0.55; }

.sugg-cost { font-size: 13px; color: var(--accent-deep); white-space: nowrap; font-variant-numeric: tabular-nums; }

.sugg-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.sugg-note { font-size: 14px; color: var(--accent-deep); margin-top: 6px; line-height: 1.45; }

.sugg .tag { margin-top: 7px; display: inline-block; }

.sugg-link { margin-top: 7px; font-size: 13.5px; word-break: break-all; }

.sugg-link a { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 2px; }

/* ---------------- route stops ---------------- */

.stop { padding: 12px 0; border-top: 1px solid var(--rule); }

.stop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.stop-label { font-family: var(--font-display); font-size: 16px; color: var(--ink); }

.stop-at { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* ---------------- cards ---------------- */

.card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

.card h3 { font-size: 19px; color: var(--ink); line-height: 1.3; }

.card .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }

.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 12px; margin-top: 14px; font-size: 14.5px; }

.kv dt { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }

.kv dd { margin: 0; }

.conf {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--ink);
  word-break: break-all;
}

.bring { margin: 14px 0 0; padding: 0; list-style: none; }

.bring li {
  position: relative;
  padding: 5px 0 5px 24px;
  font-size: 14.5px;
  border-top: 1px solid var(--rule);
}

.bring li:before {
  content: "";
  position: absolute;
  left: 3px;
  top: 12px;
  width: 9px;
  height: 9px;
  border: 1px solid var(--accent);
  border-radius: 2px;
}

/* Long bring lists collapse so they do not swamp the day. */
.bringbox { margin-top: 14px; }

.bringbox summary {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  list-style: none;
  padding: 4px 0;
  -webkit-tap-highlight-color: transparent;
}

.bringbox summary::-webkit-details-marker { display: none; }

.bring-count {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.bring-count:after { content: " ▾"; }
.bringbox[open] .bring-count:after { content: " ▴"; }

.bringbox .check:first-of-type { border-top: 1px solid var(--rule); }

.bring-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-top: 16px;
}

.warnbox {
  background: var(--alert-bg);
  color: var(--alert);
  border-radius: 10px;
  padding: 11px 13px;
  font-size: 14px;
  margin-top: 12px;
  line-height: 1.45;
}

.notebox { font-size: 14px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

.okbox {
  background: var(--ok-bg);
  color: var(--ok);
  border-radius: 10px;
  padding: 11px 13px;
  font-size: 14px;
  margin-top: 12px;
  line-height: 1.45;
}

.okbox strong { font-weight: 600; }

.okbox div { margin-top: 5px; }

.okbox a { color: var(--ok); }

/* ---------------- section headings ---------------- */

.sec {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 30px 0 12px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--rule);
}

/* ---------------- routes ---------------- */

.opt { border-left: 2px solid var(--warm); padding-left: 14px; margin: 16px 0; }

.opt h4 { font-family: var(--font-display); font-size: 17px; margin: 0; color: var(--ink); font-weight: 400; }

.opt .tag { margin-top: 5px; display: inline-block; }

.opt ul { margin: 8px 0 0; padding-left: 17px; font-size: 14px; color: var(--muted); }

.opt li { margin: 3px 0; }

.rec { background: var(--warm-soft); border-radius: 10px; padding: 13px 15px; font-size: 14.5px; color: var(--accent-deep); margin-top: 14px; }

/* ---------------- checklists ---------------- */

.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 15px; }

.check input { width: 21px; height: 21px; accent-color: var(--accent); flex: 0 0 auto; margin: 1px 0 0; }

.check.done span { text-decoration: line-through; color: var(--muted); }

/* ---------------- cash ---------------- */

.cashrow { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 15px; }

.cashrow .amt { font-variant-numeric: tabular-nums; color: var(--accent-deep); white-space: nowrap; }

.total { display: flex; justify-content: space-between; padding: 16px 0 0; margin-top: 8px; border-top: 2px solid var(--accent); font-family: var(--font-display); font-size: 20px; color: var(--accent-deep); }

/* ---------------- emergency ---------------- */

.sos { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }

.sos a { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 15px 17px; text-decoration: none; color: var(--ink); }

.sos .lbl { font-size: 15px; }

.sos .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; color: var(--accent-deep); white-space: nowrap; }

.sos.big .num { font-size: 26px; }

.sos .unverified { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--alert); display: block; margin-top: 3px; }

/* ---------------- distance ---------------- */

.dist { font-size: 13px; color: var(--accent); margin-top: 7px; font-variant-numeric: tabular-nums; }

/* Small, quiet affordance. These sit next to addresses all over the app, so
   they must not read as a wall of links. */
.applink {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
  padding-bottom: 1px;
  margin-left: 4px;
  white-space: nowrap;
}

.applink:active { color: var(--accent-deep); }

/* ---------------- bottom nav ---------------- */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-top: 1px solid var(--rule);
  z-index: 50;
}

nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 6px;
}

nav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.5; }

nav button[aria-current="true"] { color: var(--accent-deep); }

/* ---------------- theme picker ---------------- */

.themepick { display: flex; gap: 8px; margin: 10px 0 4px; }

.themepick button {
  flex: 1;
  padding: 10px 8px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--cream);
  color: var(--muted);
  font-size: 14px;
}

.themepick button[aria-current="true"] {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  color: var(--cream);
}

/* ---------------- misc ---------------- */

.empty { text-align: center; color: var(--muted); font-family: var(--font-display); font-style: italic; padding: 40px 20px; font-size: 17px; }

.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 30px 0 10px; }

<script id="app-script">/* Honeymoon offline app.
   Payload is either plaintext (dev build / saved offline copy) or an
   AES-GCM blob unlocked with a passphrase. Everything runs on-device. */

(function () {
  "use strict";

  var PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  var KEY_STORE = "hm.key.v1";
  var CHECK_STORE = "hm.checks.v1";
  var THEME_STORE = "hm.theme.v1";
  var REVEAL_STORE = "hm.reveal.v1";

  var DATA = null;
  var view = "today";
  var dayIndex = 0;
  var here = null;

  var MONTAGE_STORE = "hm.montage.v1";
  var montageAfter = null;     // where to go when it finishes or is skipped

  /* ---------------- utilities ---------------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function el(id) { return document.getElementById(id); }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToB64(bytes) {
    var s = "";
    var a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }

  function fmtTime(hhmm) {
    if (!hhmm) return "";
    var p = hhmm.split(":");
    var h = parseInt(p[0], 10);
    var m = p[1];
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ":" + m + '<span class="ampm"> ' + ampm + "</span>";
  }

  function addMinutes(hhmm, mins) {
    var p = hhmm.split(":");
    var total = parseInt(p[0], 10) * 60 + parseInt(p[1], 10) + mins;
    total = ((total % 1440) + 1440) % 1440;
    var h = Math.floor(total / 60);
    var m = total % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  function longDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  function shortDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "short", day: "numeric" });
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function daysBetween(aISO, bISO) {
    return Math.round((new Date(bISO + "T00:00:00") - new Date(aISO + "T00:00:00")) / 86400000);
  }

  /* Resolve an event's display time. Returns {kind, html, sort}. */
  function resolveTime(ev, allEvents) {
    if (ev.time) return { kind: "fixed", html: fmtTime(ev.time), sort: ev.time };
    if (ev.timeRule) {
      var anchor = null;
      for (var i = 0; i < allEvents.length; i++) {
        if (allEvents[i].id === ev.timeRule.anchorEvent) { anchor = allEvents[i]; break; }
      }
      if (anchor && anchor.time) {
        var t = addMinutes(anchor.time, ev.timeRule.offsetMinutes);
        return { kind: "derived", html: fmtTime(t), sort: t, label: ev.timeRule.label };
      }
    }
    /* No clock time. The position in the list already carries the order, so a
       "step 3" label would just be noise next to the real times. */
    return { kind: "step", html: "&mdash;", sort: "99:99" };
  }

  function haversine(a, b) {
    var R = 6371;
    var dLat = ((b[0] - a[0]) * Math.PI) / 180;
    var dLon = ((b[1] - a[1]) * Math.PI) / 180;
    var la1 = (a[0] * Math.PI) / 180;
    var la2 = (b[0] * Math.PI) / 180;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function bearing(a, b) {
    var dLon = ((b[1] - a[1]) * Math.PI) / 180;
    var la1 = (a[0] * Math.PI) / 180;
    var la2 = (b[0] * Math.PI) / 180;
    var y = Math.sin(dLon) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    var deg = ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    var names = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
    return names[Math.round(deg / 45) % 8];
  }

  /* Name and address first, coordinates only as a last resort. A coordinate
     drops an anonymous pin; an address resolves to the actual listing, with
     opening hours, phone number and the right entrance. mapQuery overrides
     both, for the few places whose name would not resolve on its own. */
  function mapsLink(placeId) {
    var p = DATA.places[placeId];
    if (!p) return "";
    var q = p.mapQuery ||
      [p.name, p.address].filter(Boolean).join(", ") ||
      (p.coords ? p.coords[0] + "," + p.coords[1] : "");
    if (!q) return "";
    return ' <a class="applink" target="_blank" rel="noopener" ' +
      'href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(q) +
      '">Maps &#8599;</a>';
  }

  /* A web page cannot trigger the iOS flight-number preview - that is a native
     text feature. A search lands on the same card: times, terminal, delay. */
  function flightLink(no) {
    return ' <a class="applink" target="_blank" rel="noopener" ' +
      'href="https://www.google.com/search?q=' + encodeURIComponent(no) +
      '">' + esc(no) + " status &#8599;</a>";
  }

  function distanceLine(placeId) {
    if (!here) return "";
    var p = DATA.places[placeId];
    if (!p || !p.coords) return "";
    var km = haversine(here, p.coords);
    var txt = km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(1) + " km";
    var walk = km < 3 ? " &middot; ~" + Math.max(1, Math.round((km / 5) * 60)) + " min walk" : "";
    return '<div class="dist">' + txt + " " + bearing(here, p.coords) + walk + "</div>";
  }

  /* ---------------- checklist persistence ---------------- */

  function checks() {
    try { return JSON.parse(localStorage.getItem(CHECK_STORE) || "{}"); } catch (e) { return {}; }
  }

  function toggleCheck(key) {
    var c = checks();
    c[key] = !c[key];
    try { localStorage.setItem(CHECK_STORE, JSON.stringify(c)); } catch (e) {}
  }

  /* ---------------- weather ---------------- */

  /* Only ever the current day, and only when online. Open-Meteo needs no key
     and no account. The last reading is cached, so an offline day still shows
     something with an honest "as of" rather than a spinner or a blank.

     Sunset is NOT fetched - the values baked in at build time come from the
     solar equation and are accurate to about a minute. Astronomy does not need
     a forecast; weather does. */

  var WEATHER_STORE = "hm.weather.v1";
  var WEATHER_MAX_AGE = 6 * 3600 * 1000;

  var WMO = {
    0: "clear", 1: "mostly clear", 2: "partly cloudy", 3: "overcast",
    45: "fog", 48: "freezing fog", 51: "light drizzle", 53: "drizzle",
    55: "heavy drizzle", 56: "freezing drizzle", 57: "freezing drizzle",
    61: "light rain", 63: "rain", 65: "heavy rain", 66: "freezing rain",
    67: "freezing rain", 71: "light snow", 73: "snow", 75: "heavy snow",
    77: "snow grains", 80: "light showers", 81: "showers", 82: "heavy showers",
    85: "snow showers", 86: "snow showers", 95: "thunderstorms",
    96: "thunderstorms with hail", 99: "thunderstorms with hail"
  };

  function weatherCache() {
    try { return JSON.parse(localStorage.getItem(WEATHER_STORE) || "null"); } catch (e) { return null; }
  }

  function weatherFor(date) {
    var c = weatherCache();
    return c && c.date === date ? c : null;
  }

  function fetchWeather(day) {
    if (!day || !day.coords || !navigator.onLine) return;

    var cached = weatherFor(day.date);
    if (cached && Date.now() - cached.fetchedAt < WEATHER_MAX_AGE) return;

    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + day.coords[0] + "&longitude=" + day.coords[1] +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
      "precipitation_probability_max,wind_speed_10m_max" +
      "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto" +
      "&start_date=" + day.date + "&end_date=" + day.date;

    fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.daily || !j.daily.time || !j.daily.time.length) return;
        var w = {
          date: day.date,
          fetchedAt: Date.now(),
          code: j.daily.weather_code[0],
          high: Math.round(j.daily.temperature_2m_max[0]),
          low: Math.round(j.daily.temperature_2m_min[0]),
          wind: Math.round(j.daily.wind_speed_10m_max[0]),
          rain: j.daily.precipitation_probability_max[0]
        };
        try { localStorage.setItem(WEATHER_STORE, JSON.stringify(w)); } catch (e) {}
        if (view === "today") render();
      })
      .catch(function () { /* offline or blocked - the cache still stands */ });
  }

  function weatherLine(day) {
    var w = weatherFor(day.date);
    if (!w) return "";

    var bits = [w.high + "&deg; / " + w.low + "&deg;"];
    if (WMO[w.code]) bits.push(WMO[w.code]);
    if (w.wind != null) bits.push("wind " + w.wind + " mph");
    if (w.rain != null && w.rain > 0) bits.push(w.rain + "% rain");

    var age = Date.now() - w.fetchedAt;
    var stale = age > WEATHER_MAX_AGE;
    var when = new Date(w.fetchedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

    return '<div class="wx' + (stale ? " stale" : "") + '" id="wx">' + bits.join(" &middot; ") +
      '<span class="wx-age">as of ' + when + (stale ? ", tap to update" : "") + "</span></div>";
  }

  /* ---------------- theme ---------------- */

  /* "system" follows the phone. "light" and "dark" override it, which matters
     because the two of you will not always want the same thing on the same
     screen in the same light. */
  function currentTheme() {
    try { return localStorage.getItem(THEME_STORE) || "system"; } catch (e) { return "system"; }
  }

  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);

    var meta = document.getElementById("theme-color");
    if (meta) meta.setAttribute("content", isDark(t) ? "#1e1712" : "#f7f1e6");
  }

  function isDark(t) {
    if (t === "dark") return true;
    if (t === "light") return false;
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }

  function setTheme(t) {
    try { localStorage.setItem(THEME_STORE, t); } catch (e) {}
    applyTheme(t);
  }

  applyTheme(currentTheme());

  /* Follow the phone live while set to "system" - iOS flips at sunset. */
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function () { if (currentTheme() === "system") applyTheme("system"); };
    if (mq.addEventListener) mq.addEventListener("change", onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);
  }

  /* ---------------- crypto ---------------- */

  function deriveKey(pass, salt, iterations) {
    return crypto.subtle
      .importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      });
  }

  function decryptWith(key) {
    return crypto.subtle
      .decrypt({ name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.ct))
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function rememberKey(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try { localStorage.setItem(KEY_STORE, bytesToB64(raw)); } catch (e) {}
    });
  }

  function tryStoredKey() {
    var stored = null;
    try { stored = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (!stored) return Promise.resolve(null);
    return crypto.subtle
      .importKey("raw", b64ToBytes(stored), { name: "AES-GCM" }, true, ["decrypt"])
      .then(function (key) {
        return decryptWith(key).then(function (data) {
              return data;
        });
      })
      .catch(function () {
        try { localStorage.removeItem(KEY_STORE); } catch (e) {}
        return null;
      });
  }

  /* ---------------- lock screen ---------------- */

  function renderLock() {
    var m = PAYLOAD.meta || {};
    var unlockAt = new Date(PAYLOAD.unlockAt);

    el("lock-script").textContent = m.script || "";
    el("lock-names").textContent = m.names || "";
    el("lock-meta").textContent = m.subtitle || "";

    function tick() {
      var ms = unlockAt - new Date();
      if (ms <= 0) {
        el("countdown").classList.add("hidden");
        el("lock-hint").textContent = m.hintAfter || "It's yours now. Type the words.";
        return;
      }
      var s = Math.floor(ms / 1000);
      var parts = [
        [Math.floor(s / 86400), "days"],
        [Math.floor((s % 86400) / 3600), "hours"],
        [Math.floor((s % 3600) / 60), "min"]
      ];
      el("countdown").innerHTML = parts
        .map(function (p) { return '<div><div class="n">' + p[0] + '</div><div class="l">' + p[1] + "</div></div>"; })
        .join("");
    }

    tick();
    setInterval(tick, 30000);

    el("lock-hint").textContent = m.hintBefore || "";

    el("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pass = el("pass").value.trim();
      if (!pass) return;
      var err = el("lock-error");
      err.textContent = "";
      el("lock-submit").textContent = "Opening…";

      deriveKey(pass, b64ToBytes(PAYLOAD.salt), PAYLOAD.iterations)
        .then(function (key) {
          return decryptWith(key).then(function (data) {
            return rememberKey(key).then(function () { return data; });
          });
        })
        .then(start)
        .catch(function () {
          err.textContent = "That isn't it.";
          el("lock-submit").textContent = m.buttonLabel || "Open";
          el("pass").value = "";
        });
    });
  }

  /* ---------------- views ---------------- */

  function eventHTML(ev, allEvents, state) {
    var t = resolveTime(ev, allEvents);
    var cls = "ev";
    if (ev.optional) cls += " optional";
    if (ev.critical) cls += " critical";
    if (state) cls += " is-" + state;

    var timeCls = t.kind === "derived" ? "ev-time derived" : t.kind === "step" ? "ev-time step" : "ev-time";
    var h = '<div class="' + cls + '"><div class="' + timeCls + '">' + t.html + "</div><div>";
    if (state) h += '<div class="nowtag">' + (state === "now" ? "happening now" : "up next") + "</div>";
    h += '<div class="ev-title">' + esc(ev.title) + "</div>";

    if (t.kind === "derived" && t.label) h += '<div class="ev-sub">' + esc(t.label) + "</div>";

    /* The app knows the time and the travel time, so it can do the subtraction
       you would otherwise be doing in your head on the way out of the door. */
    if (ev.travelMinutes >= 5 && t.kind === "fixed") {
      h += '<div class="ev-sub leaveby">Leave by ' +
        fmtTime(addMinutes(t.sort, -ev.travelMinutes)).replace(/<[^>]+>/g, "") +
        " &middot; " + ev.travelMinutes + " min to get there</div>";
    }
    if (ev.duration) h += '<div class="ev-sub">' + esc(ev.duration) + "</div>";

    var place = ev.placeRef && DATA.places[ev.placeRef];
    if (place) {
      h += '<div class="ev-sub">' + esc(place.address || place.name) + mapsLink(ev.placeRef) + "</div>";
      h += distanceLine(ev.placeRef);
    }

    var booking = ev.bookingRef && DATA.bookings[ev.bookingRef];
    if (booking && booking.confirmation) {
      h += '<div class="ev-sub">Conf <span class="conf">' + esc(booking.confirmation) + "</span></div>";
    }
    if (booking && booking.flightNumber) {
      h += '<div class="ev-sub">' + flightLink(booking.flightNumber) + "</div>";
    }

    /* An event can carry its own bring list, and so can its booking. */
    var bring = [];
    if (booking && booking.bring) bring = bring.concat(booking.bring);
    if (ev.bring) bring = bring.concat(ev.bring);

    /* Cash-only used to be a red tag here. It now lives in the bring list,
       where it is actionable rather than just alarming. The cashOnly flag is
       still on the data because the Cash view is built from it. */
    var tags = [];
    if (ev.needsPlanning) tags.push('<span class="tag plan">not sorted yet</span>');
    if (ev.routeRef) tags.push('<span class="tag">2 route options</span>');
    if (bring.length) tags.push('<span class="tag">' + bring.length + " to bring</span>");
    if (tags.length) h += '<div class="tags">' + tags.join("") + "</div>";

    if (ev.directions) h += '<div class="ev-notes">' + esc(ev.directions) + "</div>";
    if (ev.notes) h += '<div class="ev-notes">' + esc(ev.notes) + "</div>";

    /* A short list reads fine inline. A long one - the twelve things for the
       outbound flight - dominates the day and is really a packing task, so it
       collapses and each line can be ticked off as you gather it. */
    if (bring.length) {
      if (bring.length > 6) {
        var bc = checks();
        var bkey = ev.bookingRef || ev.id;
        var doneCount = bring.filter(function (_, i) { return bc["bring:" + bkey + ":" + i]; }).length;

        h += '<details class="bringbox"><summary>' +
          '<span class="bring-label" style="margin:0">Bring</span>' +
          '<span class="bring-count">' + doneCount + " of " + bring.length + " packed</span>" +
          "</summary>";
        bring.forEach(function (b, i) {
          var key = "bring:" + bkey + ":" + i;
          h += '<label class="check' + (bc[key] ? " done" : "") + '">' +
            '<input type="checkbox" data-check="' + esc(key) + '"' + (bc[key] ? " checked" : "") +
            "><span>" + esc(b) + "</span></label>";
        });
        h += "</details>";
      } else {
        h += '<div class="bring-label">Bring</div><ul class="bring">';
        bring.forEach(function (b) { h += "<li>" + esc(b) + "</li>"; });
        h += "</ul>";
      }
    }

    /* Tasks tied to a single event, ticked off and remembered. */
    if (ev.checklist && ev.checklist.length) {
      var c = checks();
      h += '<div class="bring-label">To do</div>';
      ev.checklist.forEach(function (item, i) {
        var key = "task:" + ev.id + ":" + i;
        h += '<label class="check' + (c[key] ? " done" : "") + '"><input type="checkbox" data-check="' +
          esc(key) + '"' + (c[key] ? " checked" : "") + "><span>" + esc(item) + "</span></label>";
      });
    }

    if (ev.cash) {
      h += '<div class="okbox"><strong>' + esc(ev.cash.label) + "</strong>";
      if (ev.cash.detail) h += "<div>" + esc(ev.cash.detail) + "</div>";
      h += "</div>";
    }

    if (booking && booking.warnings) {
      booking.warnings.forEach(function (w) { h += '<div class="warnbox">' + esc(w) + "</div>"; });
    }

    if (booking && booking.confirmations) {
      booking.confirmations.forEach(function (w) { h += '<div class="okbox">' + esc(w) + "</div>"; });
    }

    if (ev.routeRef && DATA.routes[ev.routeRef]) {
      h += routeHTML(DATA.routes[ev.routeRef]);
    }

    return h + "</div></div>";
  }

  function minutesOf(hhmm) {
    var p = hhmm.split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function humanGap(mins) {
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    if (h && m) return h + " hr " + m + " min";
    if (h) return h + (h === 1 ? " hour" : " hours");
    return m + " min";
  }

  /* Rendered between two timed events when there is real time to fill.
     Only appears on days that actually have suggestions. */
  function mapsSearch(q) {
    return ' <a class="applink" target="_blank" rel="noopener" ' +
      'href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(q) +
      '">Maps &#8599;</a>';
  }

  /* Most suggestions have no place record, so the query is built from the
     title plus whatever city the day is in. Anything that is not somewhere you
     can go - a nap, packing - carries noMap and gets no link. */
  function suggMaps(s, where) {
    if (s.noMap) return "";
    if (s.placeRef) return mapsLink(s.placeRef);
    if (s.mapQuery) return mapsSearch(s.mapQuery);
    if (where) return mapsSearch(s.title + ", " + where);
    return "";
  }

  function gapHTML(label, sugg, where) {
    var c = checks();
    var done = sugg.checkable
      ? sugg.items.filter(function (s) { return c["sugg:" + s.id]; }).length
      : 0;

    var h = '<details class="gap"><summary>';
    h += '<span class="gap-len">' + label + "</span>";
    h += '<span class="gap-count">' +
      (sugg.checkable ? done + " of " + sugg.items.length + " done" : sugg.items.length + " ideas nearby") +
      "</span>";
    h += "</summary><div class=\"gap-body\">";
    if (sugg.intro) h += '<p class="gap-intro">' + esc(sugg.intro) + "</p>";

    sugg.items.forEach(function (s) {
      /* A checkable pool is shared across every day that references it, so the
         key is the item id and never the date. Tick it once, it stays ticked. */
      var key = "sugg:" + s.id;
      var ticked = sugg.checkable && !!c[key];

      h += '<div class="sugg' + (ticked ? " ticked" : "") + '">';
      h += '<div class="sugg-head">';
      if (sugg.checkable) {
        h += '<input type="checkbox" data-check="' + esc(key) + '"' + (ticked ? " checked" : "") + ">";
      }
      h += '<span class="sugg-title">' + esc(s.title) + "</span>";
      if (s.cost) h += '<span class="sugg-cost">' + esc(s.cost) + "</span>";
      h += "</div>";

      var line = [];
      if (s.area) line.push(s.area);
      if (s.duration) line.push(s.duration);
      /* A shared pool spans several towns and is shown on days in different
         places, so its own region wins over whichever city the day is in -
         otherwise Budva gets searched for inside Kotor. */
      var region = sugg.region || where;
      if (line.length) h += '<div class="sugg-meta">' + esc(line.join(" · ")) + suggMaps(s, region) + "</div>";
      else h += '<div class="sugg-meta">' + suggMaps(s, region) + "</div>";
      if (s.placeRef) h += distanceLine(s.placeRef);
      if (s.bookAhead) h += '<span class="tag plan">book ahead</span>';
      if (s.note) h += '<div class="sugg-note">' + esc(s.note) + "</div>";
      if (s.url) {
        h += '<div class="sugg-link"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
          esc(s.url.replace(/^https?:\/\//, "").replace(/\/$/, "")) + "</a></div>";
      }
      if (s.restrooms) h += '<div class="sugg-meta">Restrooms: ' + esc(s.restrooms) + "</div>";
      h += "</div>";
    });

    return h + "</div></details>";
  }

  function viewToday() {
    var d = DATA.days[dayIndex];
    var today = todayISO();
    var h = "";

    var offset = daysBetween(today, DATA.meta.startDate);
    if (offset > 0) {
      h += '<div class="banner">The trip begins in ' + offset + " days. You're looking ahead.</div>";
    } else if (daysBetween(today, DATA.meta.endDate) < 0) {
      h += '<div class="banner">Home. This is the trip as it was.</div>';
    }

    h += '<div class="hdr"><div class="eyebrow">' + esc(d.location) + "</div>";
    h += "<h1>" + esc(d.title) + "</h1>";
    h += '<div class="sub">' + esc(longDate(d.date));
    if (d.sunset) h += " &middot; sunset " + fmtTime(d.sunset).replace(/<[^>]+>/g, "");
    h += "</div>";
    if (d.date === today) h += weatherLine(d);
    h += "</div>";

    if (d.summary) h += '<div class="banner">' + esc(d.summary) + "</div>";

    /* An explicit sequence always wins. Days that mix clock times with untimed
       steps carry one on every event, because sorting those by time alone puts
       an untimed morning checkout after dinner. */
    var evs = d.events.slice().sort(function (a, b) {
      if (a.sequence != null && b.sequence != null) return a.sequence - b.sequence;
      return resolveTime(a, d.events).sort.localeCompare(resolveTime(b, d.events).sort);
    });

    /* A day either carries its own suggestions or points at a shared pool.
       Pools are what let the resort days share one ticked-off checklist. */
    var sugg = d.suggestions ||
      (d.suggestionsRef && DATA.suggestionPools && DATA.suggestionPools[d.suggestionsRef]) ||
      null;

    /* Only mark now/next when you are genuinely looking at today, otherwise
       "happening now" on a day three weeks out is nonsense. */
    var nowIdx = -1, nextIdx = -1;
    if (d.date === today) {
      var mins = new Date().getHours() * 60 + new Date().getMinutes();
      evs.forEach(function (ev, i) {
        var rt = resolveTime(ev, d.events);
        if (rt.kind === "step") return;
        var startM = minutesOf(rt.sort);
        var endM = ev.endTime ? minutesOf(ev.endTime) : startM + 90;
        if (mins >= startM && mins < endM) nowIdx = i;
        else if (mins < startM && nextIdx === -1) nextIdx = i;
      });
      if (nowIdx === nextIdx) nextIdx = -1;
    }

    var placedGap = false;

    h += '<div class="events">';
    evs.forEach(function (ev, i) {
      h += eventHTML(ev, d.events, i === nowIdx ? "now" : i === nextIdx ? "next" : null);

      /* Look for a real stretch of open time before the next fixed thing. */
      if (!sugg) return;
      var next = evs[i + 1];
      if (!next) return;

      var a = resolveTime(ev, d.events);
      var b = resolveTime(next, d.events);
      if (a.kind === "step" || b.kind === "step") return;

      /* Count only hours you could actually use. A gap running from a 6:30am
         coffee to a 10am market opening is not eight free hours, and offering
         museum ideas at dawn would be nonsense. */
      var OPEN = 9 * 60;
      var CLOSE = 21 * 60;
      var from = Math.max(minutesOf(ev.endTime || a.sort), OPEN);
      var to = Math.min(minutesOf(b.sort), CLOSE);
      var gap = to - from;
      if (gap >= 180) {
        h += gapHTML(humanGap(gap) + " free", sugg, d.location);
        placedGap = true;
      }
    });
    h += "</div>";

    /* Days with little or nothing on the clock still deserve their ideas,
       just without a duration attached to them. */
    if (sugg && !placedGap) h += gapHTML(sugg.title || "If you want ideas", sugg, d.location);

    if (d.photos && d.photos.length === 0 && daysBetween(today, d.date) < 0) {
      h += '<div class="empty">Photos from this day will live here.</div>';
    }

    return h;
  }

          h += "</ul>";

        h += "</div>";
      });

    }

    /* Driving, the border and the Tube all live on the days they belong to,
       where you will actually be looking for them. Repeating them here just
       made this page long. */

    /* reference */
    h += '<div class="sec">Currency, plugs, tipping</div><div class="card">';
    DATA.reference.currency.forEach(function (x) {
      h += '<div class="cashrow"><div>' + esc(x.region) + '<div class="ev-sub">' + esc(x.note) + "</div></div><div class=\"amt\">" + esc(x.currency) + "</div></div>";
    });
    DATA.reference.plugs.forEach(function (x) {
      h += '<div class="cashrow"><div>' + esc(x.region) + '<div class="ev-sub">' + esc(x.note) + "</div></div><div class=\"amt\">" + esc(x.type) + "</div></div>";
    });
    h += "</div>";

    h += '<div class="card">';
    DATA.reference.tipping.forEach(function (x) {
      h += '<div class="cashrow"><div>' + esc(x.context) + '<div class="ev-sub">' + esc(x.guidance) + "</div></div></div>";
    });
    h += "</div>";

    /* packing */
    h += '<div class="sec">Packing</div>';
    DATA.packing.categories.forEach(function (cat) {
      h += '<div class="card"><h3>' + esc(cat.name) + "</h3>";
      cat.items.forEach(function (item, i) {
        var key = "pack:" + cat.name + ":" + i;
        h += '<label class="check' + (c[key] ? " done" : "") + '"><input type="checkbox" data-check="' + esc(key) +
          '"' + (c[key] ? " checked" : "") + "><span>" + esc(item) + "</span></label>";
      });
      h += "</div>";
    });

    /* The pre-trip checklist is tracked outside the app now - it is planning,
       not something you need standing in an airport. openItems stays in the
       data so the build still reports what is outstanding. */

    /* tools */
    h += '<div class="sec">This app</div><div class="card">';
    h += '<div class="bring-label" style="margin-top:0">Appearance</div>';
    h += '<div class="themepick">' +
      ["light", "dark", "system"].map(function (t) {
        return '<button data-theme-set="' + t + '" aria-current="' + (currentTheme() === t) + '">' +
          t.charAt(0).toUpperCase() + t.slice(1) + "</button>";
      }).join("") +
      "</div>";
    h += '<div class="bring-label">Backup</div>';
    h += '<button class="btn" id="save-offline" style="width:100%">Save a backup document</button>';
    h += '<div class="notebox">Saves the whole trip as a plain document &mdash; every day, every confirmation, what to bring, and the emergency numbers. No passphrase, no network, nothing to fail. Opens straight from Files on your phone and prints cleanly. Do this on both phones before you fly.</div>';
    h += '<button class="btn ghost" id="locate" style="width:100%;margin-top:12px">Use my location for distances</button>';
    h += '<div class="notebox">GPS works with no signal. Maps will not load, but distance and direction to any saved place will.</div>';
    h += '<button class="btn ghost" id="replay-reveal" style="width:100%;margin-top:12px">Show the welcome again</button>';
    if (montageAvailable()) {
      h += '<button class="btn ghost" id="replay-montage" style="width:100%;margin-top:12px">' +
        esc(DATA.montage.replay || "Play again") + "</button>";
    }
    h += '<div class="bring-label">Maps links</div>';
    h += '<div class="notebox" style="margin-top:6px">Addresses through the app open in Google Maps. That needs data &mdash; or the offline areas for London, Kotor Bay and Dubrovnik downloaded in the Google Maps app before you fly, which is worth doing regardless.</div>';
    h += "</div>";

    h += '<div class="foot">Made for Maddee &amp; Caleb &middot; August 2026</div>';

    return h;
  }

  function viewSOS() {
    var e = DATA.emergency;
    var h = '<div class="hdr"><div class="eyebrow">If something goes wrong</div><h1>Emergency</h1></div>';
    /* Only render the banner when there is something to say. Without the guard
       an absent warning left an empty red box floating on the page. */
    if (e.warning) h += '<div class="banner warn">' + esc(e.warning) + "</div>";

    e.numbers.forEach(function (n) {
      var big = n.number === "112";
      h += '<div class="sos' + (big ? " big" : "") + '"><a href="tel:' + esc(n.number.replace(/[\s-]/g, "")) + '">';
      h += '<div class="lbl">' + esc(n.label);
      if (n.address) h += '<div class="ev-sub">' + esc(n.address) + "</div>";
      if (n.note) h += '<div class="ev-sub">' + esc(n.note) + "</div>";
      if (n.verify) h += '<span class="unverified">unverified &mdash; check before you rely on this</span>';
      h += '</div><div class="num">' + esc(n.number) + "</div></a></div>";
    });

    if (e.missing && e.missing.length) {
      h += '<div class="sec">Still missing</div><div class="card"><ul class="bring">';
      e.missing.forEach(function (m) { h += "<li>" + esc(m) + "</li>"; });
      h += "</ul></div>";
    }

    return h;
  }

  /* ---------------- shell ---------------- */

  var NAV = [
    ["today", "Today", "M12 3v18M3 12h18"],
    ["trip", "Trip", "M4 6h16M4 12h16M4 18h10"],
    ["bookings", "Bookings", "M4 4h16v16H4zM8 9h8M8 13h5"],
    ["info", "Info", "M12 8h.01M11 12h1v5h1"],
    ["sos", "SOS", "M12 3l9 17H3zM12 9v5M12 17h.01"]
  ];

  function renderNav() {
    el("nav").innerHTML = NAV.map(function (n) {
      return '<button data-view="' + n[0] + '" aria-current="' + (view === n[0]) + '">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="' + n[2] + '"/></svg>' +
        n[1] + "</button>";
    }).join("");
  }

  function renderDaystrip() {
    var strip = el("daystrip");
    if (view !== "today") { strip.classList.add("hidden"); return; }
    strip.classList.remove("hidden");
    strip.innerHTML = DATA.days.map(function (d, i) {
      return '<button data-day="' + i + '" aria-current="' + (i === dayIndex) + '">' + esc(shortDate(d.date)) + "</button>";
    }).join("");
    var active = strip.querySelector('[aria-current="true"]');
    if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function render() {
    var main = el("main");
    main.className = "page view";
    main.innerHTML =
      view === "today" ? viewToday() :
      view === "trip" ? viewTrip() :
      view === "bookings" ? viewBookings() :
      view === "info" ? viewInfo() :
      viewSOS();
    renderNav();
    renderDaystrip();
    window.scrollTo(0, 0);
  }

  function pickTodayIndex() {
    var t = todayISO();
    for (var i = 0; i < DATA.days.length; i++) if (DATA.days[i].date === t) return i;
    return t < DATA.meta.startDate ? 0 : DATA.days.length - 1;
  }

  /* ---------------- offline copy ---------------- */

  /* The backup is a DOCUMENT, not a copy of the app.
     iOS previews HTML files in Quick Look, which does not run JavaScript - so
     a copy of this app saved to Files opens as a blank page, which is exactly
     no use in the situation you would be opening it. Everything below is
     pre-rendered plain HTML that needs nothing but a screen. */

  function docStyles() {
    return [
      "*{box-sizing:border-box}",
      "body{margin:0;padding:28px 20px 60px;background:#f7f1e6;color:#33251c;",
      "font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;",
      "max-width:720px;margin-inline:auto;-webkit-text-size-adjust:100%}",
      "h1,h2,h3{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:400;margin:0}",
      "h1{font-size:30px;color:#4a3426;letter-spacing:.04em}",
      "h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f39;",
      "margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid #e6d9c6}",
      "h3{font-size:20px;color:#4a3426;margin-top:22px}",
      ".sub{color:#8a7259;font-size:14px}",
      ".ev{padding:12px 0;border-top:1px solid #e6d9c6}",
      ".t{font-variant-numeric:tabular-nums;color:#4a3426;font-size:14px}",
      ".ti{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:18px}",
      ".n{font-size:14px;color:#5a4636;margin-top:5px}",
      ".m{font-size:13px;color:#8a7259}",
      ".conf{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.05em;color:#33251c}",
      "ul{margin:7px 0 0;padding-left:20px;font-size:14px}",
      "li{margin:3px 0}",
      ".big{font-size:26px;font-family:ui-monospace,Menlo,monospace;color:#4a3426}",
      ".card{background:#fffcf6;border:1px solid #e6d9c6;border-radius:12px;padding:16px;margin:12px 0}",
      "hr{border:0;border-top:1px solid #e6d9c6;margin:30px 0}",
      "@media print{body{background:#fff;padding:0}.card{break-inside:avoid}}"
    ].join("");
  }

  function docHTML() {
    var H = [];
    var p = function (s) { H.push(s); };

    p('<h1>' + esc(DATA.meta.title) + "</h1>");
    p('<div class="sub">' + esc(DATA.meta.startDate) + " to " + esc(DATA.meta.endDate) +
      " &middot; printed backup, generated " + new Date().toISOString().slice(0, 10) + "</div>");

    /* Emergency first. This is the page you would be opening. */
    p("<h2>Emergency</h2>");
    (DATA.emergency.numbers || []).forEach(function (n) {
      p('<div class="ev"><div class="' + (n.number === "112" ? "big" : "conf") + '">' + esc(n.number) + "</div>" +
        '<div class="ti">' + esc(n.label) + "</div>" +
        (n.note ? '<div class="n">' + esc(n.note) + "</div>" : "") +
        (n.address ? '<div class="m">' + esc(n.address) + "</div>" : "") + "</div>");
    });

    /* Day by day */
    DATA.days.forEach(function (d) {
      p("<hr><h2>" + esc(longDate(d.date)) + "</h2>");
      p("<h3>" + esc(d.title) + "</h3>");
      p('<div class="sub">' + esc(d.location) + (d.summary ? " &middot; " + esc(d.summary) : "") + "</div>");

      var evs = d.events.slice().sort(function (a, b) {
        if (a.sequence != null && b.sequence != null) return a.sequence - b.sequence;
        return resolveTime(a, d.events).sort.localeCompare(resolveTime(b, d.events).sort);
      });

      evs.forEach(function (ev) {
        var t = resolveTime(ev, d.events);
        var b = ev.bookingRef && DATA.bookings[ev.bookingRef];
        var place = ev.placeRef && DATA.places[ev.placeRef];

        p('<div class="ev">');
        p('<div class="t">' + (t.kind === "step" ? "&mdash;" : t.html.replace(/<[^>]+>/g, "")) +
          (t.kind === "derived" && t.label ? " &middot; " + esc(t.label) : "") +
          (ev.duration ? " &middot; " + esc(ev.duration) : "") + "</div>");
        p('<div class="ti">' + esc(ev.title) + "</div>");
        if (place) p('<div class="m">' + esc(place.address || place.name) +
          (place.phone ? " &middot; " + esc(place.phone) : "") + "</div>");
        if (b && b.confirmation) p('<div class="m">Conf <span class="conf">' + esc(b.confirmation) + "</span></div>");
        if (ev.directions) p('<div class="n">' + esc(ev.directions) + "</div>");
        if (ev.notes) p('<div class="n">' + esc(ev.notes) + "</div>");
        if (ev.cash) p('<div class="n"><strong>' + esc(ev.cash.label) + "</strong> " + esc(ev.cash.detail || "") + "</div>");

        var bring = [].concat((b && b.bring) || [], ev.bring || []);
        if (bring.length) {
          p("<ul>");
          bring.forEach(function (x) { p("<li>" + esc(x) + "</li>"); });
          p("</ul>");
        }
        if (ev.checklist) {
          p("<ul>");
          ev.checklist.forEach(function (x) { p("<li>" + esc(x) + "</li>"); });
          p("</ul>");
        }
        p("</div>");
      });
    });

    /* Every confirmation in one place */
    p("<hr><h2>All confirmations</h2>");
    Object.keys(DATA.bookings).forEach(function (k) {
      var b = DATA.bookings[k];
      p('<div class="card"><div class="ti">' + esc(b.title) + "</div>");
      if (b.confirmation) p('<div class="conf">' + esc(b.confirmation) + "</div>");
      if (b.confirmationAlt) p('<div class="conf">' + esc(b.confirmationAlt) + "</div>");
      [["departLocal", "Departs"], ["arriveLocal", "Arrives"], ["checkIn", "In"], ["checkOut", "Out"],
       ["pickup", "Pick up"], ["dropoff", "Drop off"], ["dateTime", "When"], ["room", "Room"],
       ["vehicle", "Car"]].forEach(function (f) {
        if (b[f[0]]) p('<div class="m">' + f[1] + ": " + esc(String(b[f[0]]).replace("T", " at ")) + "</div>");
      });
      if (b.seats) p('<div class="m">Seats: ' + esc(b.seats.caleb + " / " + b.seats.maddee) + "</div>");
      if (b.notes) p('<div class="n">' + esc(b.notes) + "</div>");
      p("</div>");
    });

    /* Practical */
    p("<hr><h2>Cash</h2>");
    p('<div class="n">' + esc(DATA.cash.note) + "</div><ul>");
    DATA.cash.items.forEach(function (i) { p("<li>" + esc(i.label) + " &mdash; EUR " + i.estimate + "</li>"); });
    p("</ul><div class=\"n\"><strong>" + esc(DATA.cash.totalEstimate) + "</strong></div>");

    p("<h2>Currency, plugs, tipping</h2><ul>");
    DATA.reference.currency.forEach(function (x) { p("<li>" + esc(x.region + " - " + x.currency + ". " + x.note) + "</li>"); });
    DATA.reference.plugs.forEach(function (x) { p("<li>" + esc(x.region + " - " + x.type + ". " + x.note) + "</li>"); });
    DATA.reference.tipping.forEach(function (x) { p("<li>" + esc(x.context + ": " + x.guidance) + "</li>"); });
    p("</ul>");

    p("<h2>Packing</h2>");
    DATA.packing.categories.forEach(function (cat) {
      p("<h3>" + esc(cat.name) + "</h3><ul>");
      cat.items.forEach(function (i) { p("<li>" + esc(i) + "</li>"); });
      p("</ul>");
    });

    return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">" +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      "<title>Honeymoon - offline backup</title><style>" + docStyles() + "</style></head><body>" +
      H.join("\n") + "</body></html>";
  }

  function saveOfflineCopy() {
    var blob = new Blob([docHTML()], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "honeymoon-backup.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ---------------- events ---------------- */

  document.addEventListener("click", function (e) {
    var nav = e.target.closest("[data-view]");
    if (nav) { view = nav.getAttribute("data-view"); render(); return; }

    var day = e.target.closest("[data-day]");
    if (day) { dayIndex = +day.getAttribute("data-day"); view = "today"; render(); return; }

    var theme = e.target.closest("[data-theme-set]");
    if (theme) { setTheme(theme.getAttribute("data-theme-set")); render(); return; }

    if (e.target.closest("#wx")) {
      var td = null;
      for (var wi = 0; wi < DATA.days.length; wi++) {
        if (DATA.days[wi].date === todayISO()) { td = DATA.days[wi]; break; }
      }
      if (td) {
        try { localStorage.removeItem(WEATHER_STORE); } catch (err) {}
        fetchWeather(td);
      }
      return;
    }

    if (e.target.id === "replay-montage") {
      armMontage();
      playMontage(function () { el("app").classList.remove("hidden"); render(); });
      return;
    }

    if (e.target.id === "replay-reveal") {
      el("app").classList.add("hidden");
      showReveal(function () { el("app").classList.remove("hidden"); render(); });
      window.scrollTo(0, 0);
      return;
    }

    if (e.target.id === "save-offline") { saveOfflineCopy(); return; }

    if (e.target.id === "locate") {
      var btn = e.target;
      btn.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        function (pos) { here = [pos.coords.latitude, pos.coords.longitude]; render(); },
        function () { btn.textContent = "Location unavailable"; },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }
  });

  document.addEventListener("change", function (e) {
    var box = e.target.closest("[data-check]");
    if (!box) return;
    toggleCheck(box.getAttribute("data-check"));

    var row = box.closest(".check");
    if (row) row.classList.toggle("done", box.checked);

    /* Keep the "3 of 12 packed" summary honest without a re-render, which
       would collapse the panel she is working in. */
    var bringbox = box.closest(".bringbox");
    if (bringbox) {
      var total = bringbox.querySelectorAll(".check").length;
      var done = bringbox.querySelectorAll("input:checked").length;
      var label = bringbox.querySelector(".bring-count");
      if (label) label.textContent = done + " of " + total + " packed";
    }

    var sugg = box.closest(".sugg");
    if (sugg) {
      sugg.classList.toggle("ticked", box.checked);
      /* Keep the "3 of 20 done" count in the summary honest. */
      var panel = box.closest(".gap");
      if (panel) {
        var total = panel.querySelectorAll(".sugg").length;
        var done = panel.querySelectorAll(".sugg input:checked").length;
        var label = panel.querySelector(".gap-count");
        if (label) label.textContent = done + " of " + total + " done";
      }
    }
  });

  /* Both routes out of the montage land in the same place. */
  el("montage-video").addEventListener("ended", finishMontage);
  el("montage-skip").addEventListener("click", finishMontage);

  /* An error only counts as an ending if she is actually watching. The element
     is loaded in the background well before any tap, so treating every error
     as "finished" would let a flaky preload mark the montage watched and
     silently consume the surprise. Off-screen, an error just means the button
     falls back to opening the trip. */
  el("montage-video").addEventListener("error", function () {
    var watching = !el("montage").classList.contains("hidden");
    if (window.console) console.warn("montage error, watching:", watching);
    if (watching) finishMontage();
  });

  /* ---------------- boot ---------------- */

  /* ---------------- montage ----------------

     Streamed, not decrypted. The file has an unguessable content-addressed
     name that lives inside the encrypted payload, so it cannot be found
     without unlocking first - but the browser handles it as an ordinary MP4.
     That means it starts in about a second, seeks properly, and never holds
     the whole thing in memory.

     Nothing is fetched until she chooses to watch: preload is "none" and the
     src is only attached so that play() can be called synchronously inside
     her tap. iOS refuses sound otherwise. */

  function montageSeen() {
    try { return localStorage.getItem(MONTAGE_STORE) === "1"; } catch (e) { return false; }
  }

  function montageAvailable() {
    return !!(DATA && DATA.montage && DATA.montage.file);
  }

  /* Attach the source without fetching a byte. If she taps "maybe later",
     no data is used at all. */
  function armMontage() {
    if (!montageAvailable()) return;
    var v = el("montage-video");
    v.preload = "none";
    if (v.getAttribute("src") !== DATA.montage.file) v.setAttribute("src", DATA.montage.file);
  }

  function releaseMontage() {
    var v = el("montage-video");
    try { v.pause(); } catch (e) {}
  }

  function playMontage(after) {
    montageAfter = after;
    el("reveal").classList.add("hidden");
    el("app").classList.add("hidden");
    el("montage").classList.remove("hidden");
    window.scrollTo(0, 0);
    /* Synchronous, inside the tap. Nothing may be awaited above this line. */
    var p = el("montage-video").play();
    if (p && p.catch) p.catch(function () { /* controls are visible */ });
  }

  function finishMontage() {
    try { localStorage.setItem(MONTAGE_STORE, "1"); } catch (e) {}
    releaseMontage();
    el("montage").classList.add("hidden");
    var next = montageAfter;
    montageAfter = null;
    if (next) next();
  }

  /* Shown once, the first time the passphrase works on a given device. The
     whole countdown exists for this moment, so it gets its own screen rather
     than dropping straight into a bookings list. */
  function revealSeen() {
    try { return localStorage.getItem(REVEAL_STORE) === "1"; } catch (e) { return false; }
  }

  function showReveal(then) {
    var r = DATA.reveal;
    /* From the reveal's own data, not the lock screen's metadata - the latter
       only exists in the encrypted build, so it renders empty in dev. */
    el("reveal-script").textContent = r.script || (PAYLOAD.meta && PAYLOAD.meta.script) || "";
    el("reveal-title").textContent = r.title || "";
    el("reveal-title").classList.toggle("hidden", !r.title);
    el("reveal-lines").innerHTML = (r.lines || [])
      .map(function (l) { return '<p class="reveal-line">' + esc(l) + "</p>"; })
      .join("");
    el("reveal").classList.remove("hidden");

    var dismiss = function () {
      try { localStorage.setItem(REVEAL_STORE, "1"); } catch (e) {}
      el("reveal").classList.add("hidden");
      then();
    };

    /* Attach the source without fetching anything, so play() can be called
       synchronously in her tap. Nothing downloads if she chooses later. */
    var wantsMontage = montageAvailable() && !montageSeen();
    var go = el("reveal-go");
    var later = el("reveal-later");

    if (!wantsMontage) {
      go.textContent = r.button || "Open";
      later.classList.add("hidden");
      go.onclick = dismiss;
      return;
    }

    armMontage();
    go.textContent = (DATA.montage && DATA.montage.label) || "Open for a surprise";
    later.textContent = (DATA.montage && DATA.montage.later) || "Maybe later";
    later.classList.remove("hidden");

    go.onclick = function () {
      try { localStorage.setItem(REVEAL_STORE, "1"); } catch (e) {}
      playMontage(then);
    };
    later.onclick = dismiss;
  }

  function start(data) {
    DATA = data;
    dayIndex = pickTodayIndex();
    el("lock").classList.add("hidden");

    /* Quietly refresh today's forecast if it is stale. Failures are silent -
       nothing about this is allowed to get in the way of the itinerary. */
    var todayDay = null;
    for (var i = 0; i < DATA.days.length; i++) {
      if (DATA.days[i].date === todayISO()) { todayDay = DATA.days[i]; break; }
    }
    if (todayDay) fetchWeather(todayDay);

    var openApp = function () {
      el("app").classList.remove("hidden");
      render();
    };

    if (DATA.reveal && !revealSeen()) showReveal(openApp);
    else openApp();
  }

  if (!PAYLOAD.locked) {
    start(PAYLOAD.data);
  } else {
    tryStoredKey().then(function (data) {
      if (data) start(data);
      else { el("lock").classList.remove("hidden"); renderLock(); }
    });
  }

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    /* If a new worker takes over after this page already had one, the page in
       front of you is the old build. Reload once so an updated itinerary shows
       up without needing a second manual refresh. */
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
